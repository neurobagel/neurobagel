name: docker nightly (reusable)

# The `nightly` image of one tool (api, federation-api), built from its own folder with its
# Dockerfile, as upstream's build_docker_nightly.yml. Called by the tool's workflow
# (tool-<tool>.yml) on push to main after its tests pass. The registry and namespace come
# from the repository variables IMAGE_REGISTRY and IMAGE_NAMESPACE (ghcr for validation,
# Docker Hub in production).
on:
  workflow_call:
    inputs:
      tool:
        description: Tool folder name under tools/ (the build context)
        required: true
        type: string
      image:
        description: Image name (e.g. api, federation_api)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check registry configuration
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY }}
          NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
        run: |
          if [ -z "$REGISTRY" ] || [ -z "$NAMESPACE" ]; then
            echo "::error::Set the repository variables IMAGE_REGISTRY and IMAGE_NAMESPACE"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tool's symlinks into recipes/ and examples/ (former submodules) would dangle
      # inside the build context. Replace them with copies, as upstream's build context had
      # the submodule contents.
      - name: Materialize symlinks in the build context
        working-directory: tools/${{ inputs.tool }}
        run: |
          git ls-files -s . | awk '$1=="120000" {print $4}' | while read -r link; do
            target="$(readlink -f "$link")"
            rm "$link"
            cp -R "$target" "$link"
            echo "materialized $link"
          done

      - name: Login to Docker Hub
        if: vars.IMAGE_REGISTRY == 'docker.io'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to ghcr
        if: vars.IMAGE_REGISTRY == 'ghcr.io'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64, linux/amd64
          context: tools/${{ inputs.tool }}
          file: tools/${{ inputs.tool }}/Dockerfile
          push: true
          tags: ${{ vars.IMAGE_REGISTRY }}/${{ vars.IMAGE_NAMESPACE }}/${{ inputs.image }}:nightly
