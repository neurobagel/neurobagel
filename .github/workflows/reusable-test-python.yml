name: test python (reusable)

# Tests one Python tool with its own locked dependencies, on the Python versions given by
# the calling workflow (tool-<tool>.yml).
on:
  workflow_call:
    inputs:
      tool:
        description: Tool folder name under tools/ (e.g. api)
        required: true
        type: string
      python-versions:
        description: Python versions to test, as a JSON list (e.g. '["3.12", "3.13"]')
        required: true
        type: string
      pytest-args:
        description: Test selection (service-dependent tests are deselected here)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: tools/${{ inputs.tool }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history: hatch-vcs reads the package version from its tags
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }} with uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --python ${{ matrix.python-version }} --group dev

      - name: Test with pytest
        run: uv run --python ${{ matrix.python-version }} pytest ${{ inputs.pytest-args }} --cov --cov-branch --cov-report=xml

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ inputs.tool }}
          files: tools/${{ inputs.tool }}/coverage.xml
