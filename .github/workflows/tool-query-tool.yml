name: query-tool

on:
  push:
    branches: [main]
    paths:
      - "tools/query-tool/**"
      - "recipes/**"
      - "examples/**"
      - ".github/workflows/tool-query-tool.yml"
      - ".github/workflows/reusable-test-node.yml"
      - ".github/workflows/reusable-docker-nightly-query-tool.yml"
  pull_request:
    paths:
      - "tools/query-tool/**"
      - "recipes/**"
      - "examples/**"
      - ".github/workflows/tool-query-tool.yml"
      - ".github/workflows/reusable-test-node.yml"
      - ".github/workflows/reusable-docker-nightly-query-tool.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-node.yml
    with:
      tool: query-tool
      component-env: NB_API_QUERY_URL=https://federate.neurobagel.org/
      e2e-env: |
        NB_API_QUERY_URL=https://federate.neurobagel.org/
        NB_ENABLE_AUTH=true
        NB_QUERY_CLIENT_ID=mockclientid
    secrets: inherit

  # On push to main (and by hand on main): the `nightly` image, after the tests pass.
  nightly:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker-nightly-query-tool.yml
    secrets: inherit
