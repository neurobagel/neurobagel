name: release

# release-please keeps one combined release PR for all tools and recipes (versions,
# changelogs). Merging it makes release-please create one GitHub Release, and with it the
# tag <component>-v<version>, per released folder. Its outputs then start the publishing
# jobs below.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      recipes: ${{ steps.rp.outputs['recipes--release_created'] }}
      recipes-version: ${{ steps.rp.outputs['recipes--version'] }}
      api: ${{ steps.rp.outputs['tools/api--release_created'] }}
      api-version: ${{ steps.rp.outputs['tools/api--version'] }}
      federation-api: ${{ steps.rp.outputs['tools/federation-api--release_created'] }}
      federation-api-version: ${{ steps.rp.outputs['tools/federation-api--version'] }}
      query-tool: ${{ steps.rp.outputs['tools/query-tool--release_created'] }}
      query-tool-version: ${{ steps.rp.outputs['tools/query-tool--version'] }}
      configure-nb: ${{ steps.rp.outputs['tools/configure-nb--release_created'] }}
      configure-nb-version: ${{ steps.rp.outputs['tools/configure-nb--version'] }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.NB_BOT_ID }}
          private-key: ${{ secrets.NB_BOT_KEY }}

      # The bot token makes release PRs trigger CI (GITHUB_TOKEN PRs do not).
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Show outputs
        env:
          OUTPUTS: ${{ toJSON(steps.rp.outputs) }}
        run: echo "$OUTPUTS"

  # --- publishing: images v<version> and latest, configure-nb on PyPI, the site ----------
  # Reruns: "Re-run failed jobs" on this workflow run; reusable-sites.yml can also be run by
  # hand.
  # recipes publishes nothing beyond its GitHub Release.
  api-image:
    needs: release-please
    if: needs.release-please.outputs.api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker-release.yml
    with:
      tool: api
      image: api
      version: ${{ needs.release-please.outputs.api-version }}
    secrets: inherit

  federation-api-image:
    needs: release-please
    if: needs.release-please.outputs.federation-api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker-release.yml
    with:
      tool: federation-api
      image: federation_api
      version: ${{ needs.release-please.outputs.federation-api-version }}
    secrets: inherit

  # The app shows its version from package.json, which the release PR already set to the
  # released version.
  query-tool-image:
    needs: release-please
    if: needs.release-please.outputs.query-tool == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker-release.yml
    with:
      tool: query-tool
      image: query_tool
      version: ${{ needs.release-please.outputs.query-tool-version }}
    secrets: inherit

  query-tool-site:
    needs: release-please
    if: needs.release-please.outputs.query-tool == 'true'
    uses: ./.github/workflows/reusable-sites.yml
    with:
      tool: query-tool
      version: ${{ needs.release-please.outputs.query-tool-version }}
    secrets: inherit

  configure-nb:
    needs: release-please
    if: needs.release-please.outputs.configure-nb == 'true'
    uses: ./.github/workflows/reusable-configure-nb-release.yml
    with:
      version: ${{ needs.release-please.outputs.configure-nb-version }}
    secrets: inherit
