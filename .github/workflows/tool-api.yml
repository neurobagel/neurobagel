name: api

on:
  push:
    branches: [main]
    paths:
      - "tools/api/**"
      - "recipes/**"
      - "examples/**"
      - ".github/workflows/tool-api.yml"
      - ".github/workflows/reusable-test-python.yml"
      - ".github/workflows/reusable-docker-nightly.yml"
  pull_request:
    paths:
      - "tools/api/**"
      - "recipes/**"
      - "examples/**"
      - ".github/workflows/tool-api.yml"
      - ".github/workflows/reusable-test-python.yml"
      - ".github/workflows/reusable-docker-nightly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/reusable-test-python.yml
    with:
      tool: api
      # the same versions as the tool's own CI (tools/api/.github/workflows/test.yaml)
      python-versions: '["3.10", "3.11", "3.12", "3.13"]'
      # Tests marked `integration` need a running graph store (service-dependent): skipped
      # during the migration, they move to the global integration test suite.
      pytest-args: -m "not integration"
    secrets: inherit

  # On push to main (and by hand on main): the `nightly` image, after the tests pass.
  nightly:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-docker-nightly.yml
    with:
      tool: api
      image: api
    secrets: inherit
